[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "ea_encoder_lstm"
version = "0.0.1"
authors = [
  { name="Alberto Bassi", email="alberto.bassi98@gmail.com" },
]
description = "Learning relevant catchment features from attributes with modified entity-aware LSTMs"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/abassi98/"
Issues = "https://github.com/abassi98/"