# Small environment for the intrinsic-dimension analysis (Fig. 2, GRIDE).
# DADApy's compiled extensions require numpy < 2, so it cannot share the main environment.
#   conda env create -f environment-gride.yml
#   conda activate ea-encoder-lstm-gride
name: ea-encoder-lstm-gride
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==1.26.4
      - pandas==2.2.3
      - scipy==1.15.3
      - matplotlib==3.10.0
      - seaborn==0.13.2
      - scikit-learn==1.7.0
      - numba==0.65.1
      - h5py==3.13.0
      - tqdm==4.67.1
      - torch==2.7.1
      - pytorch-lightning==2.5.2
      - dadapy==0.3.1
